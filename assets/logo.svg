<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="580" height="140" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- ARCHITECTURAL CONSTRUCTION TOWER & CRANE GIRDERS EMBLEM -->
  <g transform="translate(18, 14)">
    <!-- Structural Pylon / Tower Column 1 (Left Ascent) -->
    <path d="M12 96 L42 96 L42 42 L12 56 Z" fill="url(#amberGrad)" />
    
    <!-- Heavy Center Tower / Apex Mast (Center Peak) -->
    <path d="M46 96 L78 96 L78 16 L46 32 Z" fill="url(#orangeGrad)" />
    
    <!-- Structural Truss Column 3 (Right Support) -->
    <path d="M82 96 L114 96 L114 48 L82 62 Z" fill="url(#goldGrad)" />
    
    <!-- Heavy Concrete Foundation Beam / Plinth -->
    <path d="M4 96 L122 96 L108 107 L18 107 Z" fill="url(#darkGrad)" />
    
    <!-- Cross-Bracing Structural Trusses -->
    <line x1="12" y1="56" x2="114" y2="48" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" stroke-dasharray="5 3" />
    <line x1="42" y1="96" x2="78" y2="16" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6" stroke-dasharray="4 3" />
    
    <!-- Top Crane / Survey Beacon Marker -->
    <circle cx="78" cy="16" r="3.5" fill="#FBBF24" />
  </g>

  <!-- BRAND WORDMARK -->
  <text x="156" y="68" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">
    APEX
  </text>
  <text x="282" y="68" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#EA580C" letter-spacing="0.04em">
    CONSTRUCTIONS
  </text>

  <!-- DISCIPLINE & IDENTITY SUBTITLE -->
  <text x="158" y="98" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="0.28em">
    ENGINEERING &amp; INFRASTRUCTURE
  </text>
</svg>
